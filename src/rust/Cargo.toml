[package]
name = 'geokit'
publish = false
version = '0.1.0'
edition = '2021'
rust-version = '1.87.0'

[lib]
crate-type = [ 'staticlib' ]
name = 'geokit'

[dependencies]
extendr-api = { version = "*", default-features = false, features = ['result_list'], git = "https://github.com/Yunuuuu/extendr.git", branch = "from_iterator"  }
thiserror = { version = "*" }
anyhow = { version = "*" }
regex = { version = "*" }
memchr = { version = "*" }
rayon = { version = "*" }
hashbrown = { version = "0.16", default-features = false, features = ['default-hasher'] }
indexmap = { version = "*" }
# itertools = { version = "0.14", default-features = false, features = ['use_std'] }
indicatif = {version = "*", features = ["rayon"]}
flate2 = { version = "*" }
isal-rs = { version = "*", optional = true }
pprof = { version = "0.14", features = ["flamegraph"], optional = true }

# remove openssl dependency due to error when loading R package: undefined symbol: EVP_bf_ecb
# enable the system proxy feature and socks5 proxy support: https://docs.rs/reqwest/latest/reqwest/#proxies
# reqwest = { version = '*', default-features = false, features = ['system-proxy', 'socks', 'stream', 'http2', 'rustls-tls'] }

# use tokio stream to download files
# tokio = "*"
# tokio-stream = "*"

[profile.release]
lto = true
codegen-units = 1
